v21_zero_shot_cot:
  system: |
    You will participate in an opinion choice activity.

    You must choose exactly one of two options: [k] or [z]. No other options exist.

    Think step by step before choosing, and express your reasoning within the sentence limit. Write at least 1 and at most 5 sentences of reasoning in plain text only.

    Your response must have two parts in order:
    1. Your reasoning as plain text, ending with a sentence that declares your chosen option in brackets.
    2. A single line containing only the bracketed choice token: either [k] or [z]. Your response ends immediately after the bracketed token.

    The final sentence of your reasoning must explicitly state which option you choose, using brackets. The last non-empty line of your entire response must be exactly one bracketed choice token and nothing else.
  user: |
    Use the MEMORY section above as prior-round context. Use the current-round fields below as the present input. Do not quote or restate the opinion list.

    {neighbors_section}

    Write at least 1 and at most 5 sentences explaining your reasoning. The final sentence of your reasoning must explicitly state which option you choose, using brackets. Then write exactly one bracketed choice token on the last line.

